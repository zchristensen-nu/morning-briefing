# Posts to Slack when the briefing page actually changes.
#
# Triggering on docs/index.html means this fires exactly when the site is
# updated — not on digest commits, and not on a run that failed before
# publishing.
#
# Needs a bot token rather than an incoming webhook: webhooks cannot reply in
# a thread, because they do not return the parent message's timestamp.
# Secrets: SLACK_BOT_TOKEN (xoxb-…, scope chat:write) and SLACK_CHANNEL (the
# channel ID, e.g. C0123ABCD). The bot must be invited to that channel.
# Missing secrets = the job no-ops instead of failing.
name: Notify Slack
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the briefing
        id: sum
        run: |
          F=$(ls -1 briefings/*.md | tail -1)
          DATE=$(basename "$F" .md)
          echo "title=$(head -1 "$F" | sed 's/\*//g')" >> "$GITHUB_OUTPUT"
          echo "near=near-misses/$DATE.md" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          TITLE: ${{ steps.sum.outputs.title }}
          NEAR: ${{ steps.sum.outputs.near }}
          PAGE: https://zchristensen-nu.github.io/morning-briefing/
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_CHANNEL not set — nothing posted."
            exit 0
          fi

          RESP=$(jq -n --arg c "$CHANNEL" --arg t "$TITLE" --arg u "$PAGE" '{
            channel: $c,
            text: "Your Morning Briefing is ready to review",
            blocks: [ { type: "section", text: { type: "mrkdwn",
              text: ("*<" + $u + "|" + $t + ">*\nYour Morning Briefing is ready to review") } } ]
          }' | curl -sS -X POST https://slack.com/api/chat.postMessage \
                 -H "Authorization: Bearer $TOKEN" \
                 -H 'Content-type: application/json; charset=utf-8' --data @-)

          echo "$RESP" | jq -r 'if .ok then "posted ts=\(.ts)" else "SLACK ERROR: \(.error)" end'
          echo "$RESP" | jq -e '.ok' >/dev/null || exit 1
          TS=$(echo "$RESP" | jq -r .ts)

          if [ ! -s "$NEAR" ]; then
            echo "no near-misses file for this briefing — no thread reply."
            exit 0
          fi

          jq -n --arg c "$CHANNEL" --arg ts "$TS" --arg body "$(cat "$NEAR")" '{
            channel: $c, thread_ts: $ts,
            text: ("Close calls that did not make the cut:\n" + $body),
            unfurl_links: false
          }' | curl -sS -X POST https://slack.com/api/chat.postMessage \
                 -H "Authorization: Bearer $TOKEN" \
                 -H 'Content-type: application/json; charset=utf-8' --data @- \
             | jq -r 'if .ok then "thread reply posted" else "THREAD ERROR: \(.error)" end'
